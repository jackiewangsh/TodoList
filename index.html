<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办事项</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1 class="title">待办事项</h1>

    <form class="add-form" id="add-form" autocomplete="off">
      <div class="add-row">
        <input
          class="add-input"
          id="add-input"
          type="text"
          placeholder="今天要做点什么？"
          maxlength="200"
        >
        <input
          class="due-input"
          id="due-input"
          type="date"
          title="目标完成日期"
        >
        <button class="add-btn" type="submit">添加</button>
      </div>
    </form>

    <div class="toolbar">
      <p class="summary">
        共 <span id="total-count">0</span> 项，
        待完成 <span id="pending-count">0</span> 项，
        已完成 <span id="done-count">0</span> 项
      </p>

      <div class="toolbar-actions">
        <button type="button" class="sort-btn" id="sort-btn" title="点击切换排序方式">排序：默认</button>

        <div class="filter" id="filter">
          <button type="button" class="filter-btn active" data-filter="all">全部</button>
          <button type="button" class="filter-btn" data-filter="pending">待完成</button>
          <button type="button" class="filter-btn" data-filter="done">已完成</button>
        </div>
      </div>
    </div>

    <ul class="list" id="todo-list"></ul>

    <p class="empty" id="empty-tip" hidden>暂无待办事项，添加一条开始吧</p>

    <div class="footer">
      <button class="clear-btn" id="clear-btn" type="button" hidden>清除已完成</button>
      <button class="export-btn" id="export-btn" type="button">导出为 TXT</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
